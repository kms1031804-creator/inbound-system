<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | インバウンド手配管理システム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-hero">
    <div class="mark-large">手配</div>
    <h1>インバウンド<br>手配管理システム</h1>
    <p>支店からの依頼メールの整理、ホテル部門との手配確認、計画書の作成までを一元管理します。</p>
  </div>
  <div class="login-form-side">
    <form class="login-form" id="login-form">
      <h2>ログイン</h2>
      <p class="sub">アカウント情報を入力してください。</p>

      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" placeholder="tanaka@example.co.jp" required>
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="field">
        <label for="role">役割</label>
        <select id="role">
          <option value="staff">担当者</option>
          <option value="hotel">ホテル部門</option>
          <option value="admin">管理者</option>
        </select>
      </div>

      <p id="error-msg" style="color:var(--stamp-red); font-size:13px; display:none; margin:-6px 0 12px;">
        メールアドレスとパスワードを入力してください。
      </p>

      <button type="submit">ログイン</button>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
